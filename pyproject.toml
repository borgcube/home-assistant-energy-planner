[project]
name = "home-assistant-energy-planner"
version = "0.3.0"
description = "Price normalization and planning foundation for Home Assistant Energy Planner"
requires-python = ">=3.13"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
